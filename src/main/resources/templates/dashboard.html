<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f7f9fc;
            color: #222;
        }
        .topbar {
            background: #1f2937;
            color: #fff;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container { padding: 24px; }
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            max-width: 800px;
        }
        .logout-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .page-link {
            display: inline-block;
            margin-top: 12px;
            text-decoration: none;
            color: #2563eb;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="topbar">
    <div>TradeBot Dashboard</div>
    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="logout-btn">Logout</button>
    </form>
</div>

<div class="container">
    <div class="card">
        <h2>Welcome to your dashboard</h2>
        <p>You are successfully authenticated.</p>
        <a class="page-link" th:href="@{/stock-ranking}">Open Stock Ranking</a>
    </div>
</div>
</body>
</html>
