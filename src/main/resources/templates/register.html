<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
        }
        h1 { color: #333; margin-bottom: 8px; }
        p { color: #666; margin-bottom: 24px; font-size: 14px; }
        .group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; color: #333; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #667eea; }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .msg {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
        }
        .error { background: #ffebee; color: #c62828; }
        .login-link { text-align: center; margin-top: 16px; }
        .login-link a { color: #667eea; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
<div class="card">
    <h1>Create Account</h1>
    <p>Register with a username and password.</p>

    <div class="msg error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="group">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required placeholder="Choose username">
        </div>
        <div class="group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required placeholder="Choose password">
        </div>
        <button class="btn" type="submit">Sign Up</button>
    </form>

    <div class="login-link">
        <a th:href="@{/login}">Already have an account? Login</a>
    </div>
</div>
</body>
</html>
